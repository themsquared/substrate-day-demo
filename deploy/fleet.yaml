# Substrate Scope demo fleet: 13 general-purpose agents on kagent 1.0 (built on rc2, runs on rc3 + Substrate 1.0.0).
#
# Each Agent runs on the `kagent` Harness below, whose Substrate WorkerPool is
# kagent-default (created by the kagent chart): every agent is a suspended actor
# (a snapshot) until a chat restores it onto a worker. 13 agents, one worker pod.
# The kagent 1.0 installer creates the pool but NO Harness, so it is here.
#
#   kubectl apply --dry-run=server -f deploy/fleet.yaml
#   kubectl apply -f deploy/fleet.yaml
#   kubectl wait --for=condition=Ready agents.api.kagent.dev -n kagent -l demo=substrate-scope --timeout=300s
#
# Short system prompts keep demo turns cheap (claude-haiku-4-5); SURGE asks for
# ~120 words so each turn holds its worker long enough to see.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: kagent
  labels: {demo: substrate-scope, scope.demo/pool: default}
spec:
  kagent: {}
  substrate:
    workerPoolRef: {name: kagent-default}
    # kagent 1.0 requires a per-Harness snapshot location
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: incident-scribe
  namespace: kagent
  labels:
    demo: substrate-scope
    scope.demo/pool: default
spec:
  harnessRef:
    name: kagent
  template:
    inline:
      description: An incident scribe running as a Substrate actor
      modelConfig:
        name: default-model-config
      systemPrompt: |
        You are an incident scribe. You summarize outages into crisp timelines. Be brief unless the user asks for detail.
